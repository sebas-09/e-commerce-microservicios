spring:
  application:
    name: auth-service

  data:
    mongodb:
      host: mongodb # Usa el nombre del servicio en docker-compose
      port: 27017
      database: purely_auth_service

server:
  port: 9030

eureka:
  instance:
    preferIpAddress: true # Usa la IP en vez del hostname
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

# Configuración de JWT
app:
  jwtSecret: "=================spring=boot=reactjs=purely==================="
  jwtExpirationMs: 86400000
  verificationCodeExpirationMs: 900000 # Expiración del código de verificación
