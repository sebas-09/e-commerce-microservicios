spring:
  application:
    name: order-service
  data:
    mongodb:
      host: mongodb
      port: 27017
      database: purely_order_service

server:
  port: 9070

eureka:
  instance:
    preferIpAddress: true # Usa la IP en vez del hostname
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/
